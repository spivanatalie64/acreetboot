# AcreetBoot GRUB top-level config (hardened)
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026 Natalie Cole-Clift Spiva / AcreetionOS.
#
# Installed by acreetboot install at: /EFI/acreetboot/grub/grub.cfg,
# via `grub-install --bootloader-id=acreetboot`. Sourced (not generated by
# grub-mkconfig) so there is ZERO interactive power here:
#   no `c` shell, no `e` editor, no paging, no os-prober entries.
#
# Boot chain (hardened default):
#   firmware -> GRUB (this cfg) -> microboot Linux (from ACREETBOOT-ZSWAP
#   partition payload) -> warm reboot via UEFI BootNext -> systemd-boot
#   -> chainload AcreetBootMainMenu.efi -> chosen OS.

set default=0
set timeout=3
set timeout_style=menu
set pager=1

# Kernel-stage details common to both microboot paths.
set microroot_label="ACREETBOOT-ZSWAP"
set microkernel="vmlinuz-acreetboot"
set microinitrd="initramfs-acreetboot.cpio.zst"

menuentry "AcreetBoot (hardened microboot)" --class acreetboot {
    search --no-floppy --label "${microroot_label}" --set=microroot
    linux (${microroot})/${microkernel} \
        lockdown=confidentiality module.sig_enforce=1 \
        zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=25 \
        acreetboot.mode=hardened ro quiet loglevel=only-3 nosgift
    initrd (${microroot})/${microinitrd}
}

menuentry "AcreetBoot (fast path: chainload systemd-boot)" --class acreetboot {
    search --no-floppy --file /EFI/acreetboot/systemd-bootx64.efi --set=esproot
    chainloader (${esproot})/EFI/acreetboot/systemd-bootx64.efi
    boot
}

menuentry "AcreetBoot (recovery shell in microboot)" --class acreetboot {
    search --no-floppy --label "${microroot_label}" --set=microroot
    linux (${microroot})/${microkernel} \
        lockdown=integrity module.sig_enforce=1 \
        acreetboot.mode=hardened acreetboot.recover=1 ro loglevel=7
    initrd (${microroot})/${microinitrd}
}

# Vendored GRUB core ships builtins for: linux, initrd, search, chainloader,
# reboot, halt — all consumed above; nothing user-facing is exposed.
