# AcreetBoot — CI VM relay deploy (the GHA intercept into us_ssh)
# SPDX-License-Identifier: BSD-3-Clause
name: cvm-relay-deploy
on:
  workflow_dispatch:

jobs:
  deploy-relay:
    runs-on: ubuntu-latest
    env:
      BURRITO: ${{ secrets.BURRITO }}
      COOCOO: ${{ secrets.COOCOO }}
      US_SERVER_ADDRESS: ${{ secrets.US_SERVER_ADDRESS }}
      US_SERVER_ADDRESS_PORT: ${{ secrets.US_SERVER_ADDRESS_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install sshpass + rsync
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync jq

      - name: Relay reachable-as-check (us_ssh)
        run: |
          export SSHPASS="$COOCOO"
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -p "$US_SERVER_ADDRESS_PORT" \
            "$BURRITO@$US_SERVER_ADDRESS" '
            set -e
            echo "connected: $(whoami)@$(hostname)"
            docker --version
            (id -nG | grep -qw docker) && echo "docker group: yes" || echo "docker group: NO (fall back to sudo -n)"
            '
      - name: Push relay into /srv/cvm & start
        run: |
          export SSHPASS="$COOCOO"
          export SSHPASS_DIR=relay
          sshpass -e ssh -p "$US_SERVER_ADDRESS_PORT" "$BURRITO@$US_SERVER_ADDRESS" 'mkdir -p /srv/cvm/relay'
          rsync -az -e "sshpass -e ssh -p \"$US_SERVER_ADDRESS_PORT\"" \
            linux-vmscript/relay/ "$BURRITO@$US_SERVER_ADDRESS:/srv/cvm/relay/"
          sshpass -e ssh -p "$US_SERVER_ADDRESS_PORT" "$BURRITO@$US_SERVER_ADDRESS" '
            set -e
            cd /srv/cvm/relay
            if [ ! -z "$SECRET" ]; then printf "CVM_RELAY_SECRET=%s\n" "$SECRET" > .env; chmod 600 .env; fi
            (id -nG | grep -qw docker) && DOCKER=docker || DOCKER="sudo -n docker"
            $DOCKER compose up -d --quiet-pull
            $DOCKER ps --filter name=cvm-relay --format "{{.Names}} {{.Status}}"
            curl -fsS -o /dev/null http://127.0.0.1:8477/gha -X POST \
                 -H "Content-Type: application/json" \
                 -H "X-AcreetBoot-Signature: BADSIG" --data "{}" || true
            echo "relay endpoint is up (403 on bad sig = intercept is authenticated)"
            '
        env:
          SECRET: ${{ secrets.CVM_RELAY_SECRET }}
