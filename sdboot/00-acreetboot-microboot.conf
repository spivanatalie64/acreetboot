# AcreetBoot — hardened microboot kernel entry (default)
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026 Natalie Cole-Clift Spiva / AcreetionOS.
#
# Kernel + initramfs live on the dedicated XBOOTLDR partition whose
# GPT partition label is ACREETBOOT-ZSWAP; system-boot resolves it as
# extra loader source. Lockdown options are all in this single line.

title   AcreetBoot (hardened microboot)
sort-key acreetboot-microboot
linux   /vmlinuz-acreetboot
initrd  /initramfs-acreetboot.cpio.zst
options lockdown=confidentiality module.sig_enforce=1 zswap.enabled=1 zswap.compressor=zstd zswap.max_pool_percent=25 acreetboot.mode=hardened ro quiet loglevel=3
