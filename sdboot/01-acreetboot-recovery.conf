# AcreetBoot — microboot recovery shell (auxiliary)
title   AcreetBoot (recovery shell in microboot)
sort-key acreetboot-recovery
linux   /vmlinuz-acreetboot
initrd  /initramfs-acreetboot.cpio.zst
options lockdown=integrity module.sig_enforce=1 acreetboot.mode=hardened acreetboot.recover=1 loglevel=7
