#
# systemd-boot entry: "type efi" chainloads the raw .efi binary directly.
# Maintained by `acreetboot install`; do not hand-write other entries here
# for acreetboot-managed machinery.

title   AcreetBoot
type    efi
efi     /EFI/acreetboot/AcreetBootMainMenu.efi
sort-key acreetboot
