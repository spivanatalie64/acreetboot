# AcreetBoot — systemd-boot loader glue
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026 Natalie Cole-Clift Spiva / AcreetionOS.
#
# Files below are staged to the ESP at install time:
#   loader/loader.conf                       ← exactly this file
#   loader/entries/10-acreetboot.conf        ← chainload AcreetBootMainMenu.efi
#
# IMPORTANT: the "efi" entry requires systemd-boot from systemd ≥ 254
# (or whatever your distro ships). Host systemd-boot is used as-is —
# acreetboot ships the *configuration*, not the bootloader binary.

# loader/loader.conf
timeout 5
default 10-acreetboot.conf
console-mode auto
editor no
