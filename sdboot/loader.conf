# AcreetBoot — systemd-boot primary loader configuration
# SPDX-License-Identifier: BSD-3-Clause
# Copyright (c) 2026 Natalie Cole-Clift Spiva / AcreetionOS.
#
# systemd-boot is the FIRST stage (installed as /EFI/BOOT/BOOTX64.EFI via
# bootctl install, plus a dedicated /EFI/acreetboot/systemd-bootx64.efi copy
# that the microboot stage re-boots into via UEFI BootNext when needed).
#
# It reads the microboot kernel from the dedicated XBOOTLDR partition
# labeled ACREETBOOT-ZSWAP (type GUID 06D5-B... XBOOTLDR), containing:
#   /vmlinuz-acreetboot  /initramfs-acreetboot.cpio.zst
# Default entry: microboot (hardened). Alternative: direct chainload.

default 00-acreetboot-microboot.conf
timeout 5
console-mode auto
editor no
